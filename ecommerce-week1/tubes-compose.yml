version: '3.8'

services:
  # 1. Service Database MySQL
  db:
    image: mysql:8.0
    container_name: ecommerce_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3306:3306"
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Service Backend Apollo Server (GraphQL)
  backend:
    build: ./backend
    container_name: ecommerce_graphql_app
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=ecommerce_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: