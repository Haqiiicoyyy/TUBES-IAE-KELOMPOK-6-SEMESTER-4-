<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace Modern</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-content">
      <div class="logo">
        <i class="fa-solid fa-store"></i> <span>TokoGraphQL</span>
      </div>

      <div class="search-bar">
        <input type="text" placeholder="Cari produk...">
        <button><i class="fa fa-search"></i></button>
      </div>

      <div class="nav-icons">
        <i class="fa-solid fa-bell"></i>
        <i class="fa-solid fa-cart-shopping"></i>
      </div>
    </div>
  </nav>

  <!-- BANNER -->
  <section class="banner">
    <img src="https://via.placeholder.com/1200x300?text=Promo+Marketplace">
  </section>

  <!-- KATEGORI -->
  <section class="category-list">
    <div class="category">Elektronik</div>
    <div class="category">Fashion</div>
    <div class="category">Makanan</div>
  </section>

  <!-- PRODUK -->
  <main class="main-container">
    <h2>Rekomendasi Produk</h2>
    <div class="product-grid" id="productGrid"></div>
  </main>

  <!-- TRACKING (DI BAWAH, BUKAN SIDEBAR) -->
  <section class="tracking-section">
    <h2>📦 Live Tracking <span class="pulse"></span></h2>
    <div id="trackingList"></div>
  </section>

  <!-- TOAST -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="script.js"></script>

  <section class="admin-section">
    <h2>⚙️ Seller Center (Manajemen Produk)</h2>
    
    <div class="admin-grid">
      <div class="admin-card">
        <h3>Tambah Produk Baru (Create)</h3>
        <form id="formAddProduct" class="admin-form">
          <input type="text" id="addName" placeholder="Nama Produk" required>
          <input type="number" id="addPrice" placeholder="Harga (Rp)" required min="0">
          <input type="number" id="addStock" placeholder="Stok" required min="0">
          <select id="addCategory" required>
            <option value="">Pilih Kategori...</option>
            </select>
          <button type="submit" class="btn-success"><i class="fa fa-plus"></i> Simpan Produk</button>
        </form>
      </div>

      <div class="admin-card">
        <h3>Daftar Produk</h3>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="adminProductTable">
              </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
  
  <div id="checkoutModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="margin: 0; color: #333;"><i class="fa-solid fa-truck-fast"></i> Detail Pengiriman</h3>
        <button class="btn-close" onclick="closeCheckoutModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <form id="checkoutForm">
        <input type="hidden" id="checkoutProductId">
        
        <div class="form-group" style="margin-bottom: 15px;">
          <label for="checkoutName" style="font-size: 14px; color: #555;">Nama Penerima</label>
          <input type="text" id="checkoutName" required placeholder="Contoh: Budi Santoso" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px; box-sizing: border-box;">
        </div>
        
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="checkoutAddress" style="font-size: 14px; color: #555;">Alamat Lengkap</label>
          <textarea id="checkoutAddress" required placeholder="Contoh: Jl. Sudirman No. 12, Jakarta..." rows="3" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px; font-family: inherit; resize: vertical; box-sizing: border-box;"></textarea>
        </div>
        
        <button type="submit" class="btn-submit-modal">Konfirmasi Pesanan</button>
      </form>
    </div>
  </div>
  
</body>
</html>
